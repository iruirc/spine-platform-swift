workspace: { name: dd }
remotes: [origin]
packages:
  - { name: A, archetype: api-contract, git: {origin: x}, version: 0.1.0 }
  - { name: F, archetype: feature, git: {origin: x}, version: 0.1.0 }
  - name: B
    archetype: engine
    git: { origin: x }
    version: 0.1.0
    deps: [A]                  # engine -> api-contract: the rule allows it
  - name: C
    archetype: engine
    git: { origin: x }
    version: 0.1.0
    deps: [F]                  # engine -> feature: the rule forbids it
  - name: D
    archetype: engine
    git: { origin: x }
    version: 0.1.0
    deps: [F]
    allowed_deps: [F]          # the same edge, listed as an exception
  - name: E
    archetype: library
    git: { origin: x }
    version: 0.1.0
    allowed_deps: [library]    # an archetype name, not a package
