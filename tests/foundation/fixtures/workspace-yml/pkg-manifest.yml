workspace:
  name: ManifestWS
remotes: [origin]
defaults:
  platforms: { ios: "16.0", macos: "13.4" }
  tests: xctest
packages:
  - name: Core
    archetype: api-contract
    git: { origin: git@github.com:user/Core.git }
    version: 0.1.0
    external_deps:
      - url: https://github.com/apple/swift-collections.git
        version: { from: "1.0.0" }
      - url: https://github.com/apple/swift-log.git
        version: { exact: "1.5.0" }
      - url: https://github.com/apple/swift-crypto.git
        version: { branch: main }
      - url: https://github.com/apple/swift-algorithms.git
        version: { revision: abc123def456 }
      - https://github.com/apple/swift-testing.git
      - url: https://github.com/apple/swift-nio.git
        version: "2.1.0"
  - name: App
    archetype: feature
    git: { origin: git@github.com:user/App.git }
    version: 0.1.0
    deps: [Core]
