## workspace.yml — single source of truth. "## " lines explain; "# " lines are examples to uncomment.

workspace:
  name: PLACEHOLDER_WS_NAME
  xcworkspace: true
  code_workspace: true
  tasks:
    enabled: true
    mode: sibling          # sibling | path | symlink
    path: ./Tasks          # used by sibling / path modes
    symlink_target: null   # required by symlink mode (e.g. ../../Tasks)
  docs:
    enabled: true
    mode: sibling          # sibling | path | symlink
    path: ./Docs           # used by sibling / path modes
    symlink_target: null   # required by symlink mode (e.g. ../../Docs)

toolkit:
  lang: en                 # en | ru — the toolkit config's language, and the dialog's
  mode: manual             # manual | auto
  progress: normal         # quiet | normal | live

remotes:
  - origin

## once package_groups exists, every package must name one.
# package_groups:
#   - name: common
#     dir: sharedPackages

defaults:
  default_branch: main
  push_remotes: all
  release_strategy: patch
  platforms:              # floor of generated packages; keys: ios | macos
    ios: "17.0"
    macos: "14.0"
  tests: swift-testing    # swift-testing | xctest | quick-nimble — the test stub of every package, and the apps' framework

bootstrap:
  use_gh: false
  push_after_init: false
  generate_local_skills: false
  commit_after_init: true
  initial_commit_message: Initial commit
  git_author: null

## a workspace with an app may have no packages.
